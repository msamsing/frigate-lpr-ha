set_plate:
  name: Tilføj eller opdater kendt nummerplade
  description: Gem navn, kategori, køretøjsdata og bemærkninger. Observationshistorikken ændres ikke.
  fields:
    plate:
      name: Nummerplade
      required: true
      example: AB12345
      selector:
        text:
    name:
      name: Navn
      required: true
      example: Naboens bil
      selector:
        text:
    category:
      name: Kategori
      required: true
      selector:
        select:
          options:
            - label: Egen
              value: own
            - label: Kendt lokal
              value: known
            - label: Hyrevogn
              value: taxi
            - label: Ukendt
              value: unknown
            - label: Uønsket
              value: unwanted
    notes:
      name: Bemærkninger
      selector:
        text:
          multiline: true
    make:
      name: Bilmærke
      selector:
        text:
    model:
      name: Model
      selector:
        text:
    variant:
      name: Variant
      selector:
        text:
    model_type:
      name: Modeltype
      selector:
        text:
    model_year:
      name: Modelår
      selector:
        number:
          min: 1900
          max: 2100
          mode: box
    color:
      name: Farve
      selector:
        text:
    chassis_type:
      name: Karrosseri
      selector:
        text:
    fuel_type:
      name: Drivmiddel
      selector:
        text:
    vehicle_type:
      name: Køretøjstype
      selector:
        text:
    ignored:
      name: Ignorér i oversigter
      description: Bevar sagen og historikken, men skjul køretøjet fra oversigter og trafikstatistik.
      selector:
        boolean:
    notify_on_passage:
      name: Notificér ved passage
      description: Send en notifikation til integrationens valgte modtagere, hver gang køretøjet registreres.
      selector:
        boolean:
remove_plate_metadata:
  name: Fjern navn og kategori
  description: Fjern kun brugerens metadata; observationer slettes ikke.
  fields:
    plate:
      name: Nummerplade
      required: true
      selector:
        text:
lookup_vehicle:
  name: Hent køretøjsdata fra MotorAPI
  description: Hent eller opdatér stamdata for en eksisterende lokal køretøjssag. Kræver aktiveret MotorAPI.
  fields:
    plate:
      name: Nummerplade
      required: true
      example: AB12345
      selector:
        text:
update_observation:
  name: Rediger passage
  description: Ret tidspunkt, kamera, score eller hastighed på en gemt passage og genberegn statistikken.
  fields:
    plate:
      name: Nummerplade
      required: true
      selector:
        text:
    event_id:
      name: Frigate event-ID
      required: true
      selector:
        text:
    timestamp:
      name: Tidspunkt
      required: true
      selector:
        datetime:
    camera:
      name: Kamera
      selector:
        text:
    score:
      name: LPR-score
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: box
    speed_kmh:
      name: Hastighed
      description: Passagehastighed i km/t. Lad feltet være tomt, hvis passagen ikke har en måling.
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: km/t
          mode: box
remove_observation:
  name: Slet passage
  description: Slet én passage permanent og genberegn køretøjets statistik.
  fields:
    plate:
      name: Nummerplade
      required: true
      selector:
        text:
    event_id:
      name: Frigate event-ID
      required: true
      selector:
        text:
remove_snapshot:
  name: Slet gemt køretøjsbillede
  description: Fjern det lokale billede fra køretøjssagen. Et nyt billede gemmes først ved køretøjets næste passage.
  fields:
    plate:
      name: Nummerplade
      required: true
      selector:
        text:
