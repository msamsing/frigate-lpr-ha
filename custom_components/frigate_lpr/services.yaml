set_plate:
  name: Tilføj eller opdater kendt nummerplade
  description: Gem et brugervalgt navn og en eksplicit kategori. Observationshistorikken ændres ikke.
  fields:
    plate:
      name: Nummerplade
      required: true
      example: AB12345
      selector:
        text:
    name:
      name: Navn
      required: true
      example: Naboens bil
      selector:
        text:
    category:
      name: Kategori
      required: true
      selector:
        select:
          options:
            - label: Egen
              value: own
            - label: Kendt lokal
              value: known
remove_plate_metadata:
  name: Fjern navn og kategori
  description: Fjern kun brugerens metadata; observationer slettes ikke.
  fields:
    plate:
      name: Nummerplade
      required: true
      selector:
        text:
