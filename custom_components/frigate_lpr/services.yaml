set_plate:
  name: Tilføj eller opdater kendt nummerplade
  description: Gem navn, kategori, køretøjsdata og bemærkninger. Observationshistorikken ændres ikke.
  fields:
    plate:
      name: Nummerplade
      required: true
      example: AB12345
      selector:
        text:
    name:
      name: Navn
      required: true
      example: Naboens bil
      selector:
        text:
    category:
      name: Kategori
      required: true
      selector:
        select:
          options:
            - label: Egen
              value: own
            - label: Kendt lokal
              value: known
            - label: Ukendt
              value: unknown
            - label: Uønsket
              value: unwanted
    notes:
      name: Bemærkninger
      selector:
        text:
          multiline: true
    make:
      name: Bilmærke
      selector:
        text:
    model:
      name: Model
      selector:
        text:
    variant:
      name: Variant
      selector:
        text:
    model_type:
      name: Modeltype
      selector:
        text:
    model_year:
      name: Modelår
      selector:
        number:
          min: 1900
          max: 2100
          mode: box
    color:
      name: Farve
      selector:
        text:
    chassis_type:
      name: Karrosseri
      selector:
        text:
    fuel_type:
      name: Drivmiddel
      selector:
        text:
    vehicle_type:
      name: Køretøjstype
      selector:
        text:
remove_plate_metadata:
  name: Fjern navn og kategori
  description: Fjern kun brugerens metadata; observationer slettes ikke.
  fields:
    plate:
      name: Nummerplade
      required: true
      selector:
        text:
lookup_vehicle:
  name: Hent køretøjsdata fra MotorAPI
  description: Hent eller opdatér stamdata for en eksisterende lokal køretøjssag. Kræver aktiveret MotorAPI.
  fields:
    plate:
      name: Nummerplade
      required: true
      example: AB12345
      selector:
        text:
